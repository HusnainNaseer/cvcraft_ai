# Render Blueprint: free Docker web service. Values marked sync: false are asked for when you create it.
services:
  - type: web
    name: cvcraft-ai
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Supabase Postgres keeps CVs and sessions across restarts (the container disk is wiped).
      # DB_URL: the Session pooler connection string (port 5432), not Direct connection (IPv6 only).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: GEMINI_API_KEYS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # The free plan has 512 MB of memory; fewer PHP workers leave room for Chromium.
      - key: PHP_CLI_SERVER_WORKERS
        value: "2"
